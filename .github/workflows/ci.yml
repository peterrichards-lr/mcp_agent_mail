name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Read-only by default: no job here needs to write to the repository.
permissions:
  contents: read

jobs:
  build-and-test:
    name: Lint, Type Check, Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # The server targets Python 3.14 only (pyproject.toml requires-python). The agent-machine
        # client scripts are separate and support 3.9+ (windows-client.yml covers Windows).
        python-version: ['3.14']

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install uv
        shell: bash
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          uv --version

      - name: Cache uv dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/uv
            .venv
          key: ci-uv-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            ci-uv-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Sync dependencies
        shell: bash
        run: |
          uv sync --dev

      - name: Lint (ruff)
        shell: bash
        run: |
          uv run ruff check

      - name: Type check
        shell: bash
        run: |
          uvx ty check

      - name: Run tests
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          uv run -m pytest -q

      - name: Smoke test am-run (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          uv run python -m mcp_agent_mail.cli am-run ci-slot -- echo "ok"

      - name: Run performance benchmarks (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          PYTHONUTF8: "1"
          RUN_BENCHMARKS: "1"
          INSTRUMENTATION_ENABLED: "true"
        run: |
          uv run -m pytest tests/benchmarks/ -v -m benchmark --tb=short

      - name: CI Performance Regression Check (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          uv run -m pytest tests/benchmarks/test_ci_regression.py -v -m ci_regression --tb=short

      - name: Upload regression report artifact
        if: matrix.os == 'ubuntu-latest' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: regression-reports-py${{ matrix.python-version }}
          path: tests/benchmarks/regression_reports/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload benchmark results artifact
        if: matrix.os == 'ubuntu-latest' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-results-py${{ matrix.python-version }}
          path: tests/benchmarks/results/
          if-no-files-found: ignore
          retention-days: 30
