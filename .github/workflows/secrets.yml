name: Secret scan

# gitleaks over the commits being pushed or proposed. It doesn't depend on each clone having
# enabled .githooks/pre-commit, and it catches what that hook can't (git add -f, other machines).
# It scans new commits only: upstream's history contains known, long-dead secrets (see SECURITY.md).
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read
  pull-requests: read  # gitleaks-action lists a pull request's commits through the API

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Scan the new commits
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
