name: Windows client

# The agent-machine client (scripts/hooks, install.ps1) on real Windows: file locking,
# command lines, UTF-8 and the PowerShell installer, against a live server process.
on:
  push:
    branches: [main, "windows-*"]
    paths:
      - scripts/hooks/**
      - src/mcp_agent_mail/templates/install.*
      - src/mcp_agent_mail/http.py
      - tests/live_server.py
      - tests/test_mail_wake.py
      - tests/test_installer.py
      - tests/test_file_attachments.py
      - .github/workflows/windows-client.yml
  # Pull requests are how changes land (decision 0008), so client changes are tested on Windows before merging.
  pull_request:
    paths:
      - scripts/hooks/**
      - src/mcp_agent_mail/templates/install.*
      - src/mcp_agent_mail/http.py
      - tests/live_server.py
      - tests/test_mail_wake.py
      - tests/test_installer.py
      - tests/test_file_attachments.py
      - .github/workflows/windows-client.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client:
    name: Client tests (windows-latest, py3.14)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv and Python
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.14"

      - name: Sync dependencies
        run: uv sync --dev

      - name: Client tests
        run: uv run -m pytest --no-cov -p no:cacheprovider -q tests/test_mail_wake.py tests/test_installer.py tests/test_file_attachments.py
