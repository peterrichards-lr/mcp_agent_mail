{% extends "base.html" %}

{% block title %}Sign in — Agent Mail{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-16 animate-fade-in">
  <div class="bg-white dark:bg-slate-800 rounded-xl p-8 shadow-soft border border-slate-200 dark:border-slate-700">
    <div class="flex items-center gap-4 mb-6">
      <div class="w-12 h-12 bg-gradient-to-br from-primary-500 to-primary-700 rounded-xl flex items-center justify-center shadow-medium">
        <i data-lucide="lock" class="w-6 h-6 text-white"></i>
      </div>
      <div>
        <h1 class="text-2xl font-bold text-slate-900 dark:text-white">Sign in</h1>
        <p class="text-sm text-slate-600 dark:text-slate-400">Paste this server's bearer token (<code>HTTP_BEARER_TOKEN</code>).</p>
      </div>
    </div>
    <form method="post" action="/mail/login" class="space-y-4">
      <input type="hidden" name="next" value="{{ next }}">
      <input type="password" name="token" required autofocus autocomplete="current-password"
             aria-label="Bearer token"
             class="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-slate-900 dark:text-white">
      {% if error %}
        <p class="text-sm text-red-600 dark:text-red-400" role="alert">{{ error }}</p>
      {% endif %}
      <button type="submit" class="w-full px-4 py-2 bg-primary-600 hover:bg-primary-700 text-white font-medium rounded-lg transition-colors">
        Sign in
      </button>
    </form>
  </div>
</div>
{% endblock %}
